# Veröffentlicht das Haushaltsbuch über GitHub Pages.
#
# Zwei Schritte, bewusst getrennt: Die Umgebung "github-pages" gibt es erst,
# wenn Pages aktiv ist. Stünde sie schon am ersten Job, bräche der Lauf ab,
# bevor irgendetwas laufen kann. Der erste Job schaltet Pages frei und packt
# die Dateien, der zweite veröffentlicht sie.

name: Seite veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  vorbereiten:
    runs-on: ubuntu-latest
    steps:
      - name: Stand auschecken
        uses: actions/checkout@v4

      - name: Rechenkern prüfen
        run: node --test

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Dateien einpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  veroeffentlichen:
    needs: vorbereiten
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichung.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: veroeffentlichung
        uses: actions/deploy-pages@v4
