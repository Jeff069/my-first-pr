# Veröffentlicht das Haushaltsbuch über GitHub Pages.
# Der Schritt "configure-pages" mit enablement schaltet Pages beim ersten Lauf
# selbst frei - es muss dafür nichts in den Einstellungen geklickt werden.

name: Seite veröffentlichen

on:
  push:
    branches:
      - main
      - claude/planmodus-3635uv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung gleichzeitig, laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichung.outputs.page_url }}
    steps:
      - name: Stand auschecken
        uses: actions/checkout@v4

      - name: Rechenkern prüfen
        run: node --test

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Dateien einpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veröffentlichen
        id: veroeffentlichung
        uses: actions/deploy-pages@v4
