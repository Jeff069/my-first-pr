# Prüft bei jedem Push und jedem Pull Request, ob alle Dateien der
# Prettier-Formatierung entsprechen. Diese Prüfung läuft auf GitHub und
# lässt sich lokal nicht umgehen — anders als Format-beim-Speichern.

name: Formatierung

on: [push, pull_request]

jobs:
  prettier:
    name: Prettier-Check
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Formatierung prüfen
        run: npm run format:check
